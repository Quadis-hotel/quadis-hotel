<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Official marks, replacing the inline-SVG "Q" placeholder. -->
    <link rel="icon" type="image/svg+xml" href="/logo/quadis-favicon.svg" />
    <link rel="apple-touch-icon" href="/logo/quadis-app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      ======================================================================
      THIS HEAD IS WHAT EVERY NON-JS CRAWLER SEES, ON EVERY ONE OF THE 25 URLs.

      The site is a client-rendered SPA and there is no prerender or SSR step
      (vite.config.ts is a plain SPA build; vercel.json and render.yaml both
      rewrite /* to /index.html). src/components/Seo.tsx replaces everything
      below once React mounts, which Googlebot will see — but "view source",
      curl, and every social scraper (WhatsApp, Facebook, LinkedIn, X, Slack)
      will not. That is the failure the client's SEO person described on 4 Aug
      2026 and it cannot be fixed from inside the app; see the note at the top
      of src/components/Seo.tsx.

      So the tags here are set to the HOME page's copy rather than to a generic
      group blurb: / is the most crawled and most shared URL, and if only one
      page's metadata can survive without JavaScript it should be that one.

      The title and description are the client's own words, supplied verbatim
      in her feedback PDF, page 1, 5 Aug 2026. They are duplicated in
      src/data/seo.ts under the '/' key — the two MUST be edited together, and
      neither should be reworded without asking her.
      ======================================================================
    -->
    <title>Best Budget hotels in Delhi &amp; Noida | Quadis Group of Hotels</title>
    <meta
      name="description"
      content="Book budget-friendly hotel rooms in Delhi NCR at Quadis offering comfort and great connectivity near Lajpat Nagar, East of Kailash, New Ashok Nagar, and Noida."
    />
    <meta name="robots" content="index, follow" />
    <!--
      www, not the apex. The apex 301s to www on the client's live host, so an
      apex canonical points every page at a redirect. Must stay in step with
      SITE_ORIGIN in src/data/seo.ts and ORIGIN in scripts/generate-sitemap.mjs.
    -->
    <link rel="canonical" href="https://www.quadishotels.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quadis Hotels" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Best Budget hotels in Delhi &amp; Noida | Quadis Group of Hotels" />
    <meta
      property="og:description"
      content="Book budget-friendly hotel rooms in Delhi NCR at Quadis offering comfort and great connectivity near Lajpat Nagar, East of Kailash, New Ashok Nagar, and Noida."
    />
    <meta property="og:url" content="https://www.quadishotels.com/" />
    <!--
      hero.webp, not hero.jpg. The old default in Seo.tsx pointed at
      /images/home/hero.jpg, which has never existed on disk — so every link
      the client shared previewed with a broken image.
    -->
    <meta property="og:image" content="https://www.quadishotels.com/images/home/hero.webp" />
    <meta property="og:image:alt" content="Quadis Group of Hotels — budget hotels across Delhi and Noida" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Best Budget hotels in Delhi &amp; Noida | Quadis Group of Hotels" />
    <meta
      name="twitter:description"
      content="Book budget-friendly hotel rooms in Delhi NCR at Quadis offering comfort and great connectivity near Lajpat Nagar, East of Kailash, New Ashok Nagar, and Noida."
    />
    <meta name="twitter:image" content="https://www.quadishotels.com/images/home/hero.webp" />
    <meta name="twitter:image:alt" content="Quadis Group of Hotels — budget hotels across Delhi and Noida" />
    <meta name="twitter:url" content="https://www.quadishotels.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
