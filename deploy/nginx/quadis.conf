# Production nginx for the Quadis one-box shape.
#
# This REPLACES the stub that deploy/bootstrap.sh writes. bootstrap.sh only ever
# had to answer /healthz so certbot could complete; it `touch`es an EMPTY
# legacy-redirects.conf, which means every one of the client's 63 indexed URLs
# 404s until this file is installed. See AGENTS.md 3a.
#
# Installed by deploy/install.sh. Do not hand-edit on the box — the next deploy
# overwrites it.

# ----------------------------------------------------------------------------
# Is this request the Let's Encrypt HTTP-01 challenge?
#
# This exists only to let the apex->www redirect below make an exception for it.
# nginx `if` cannot AND two conditions, so the condition is precomputed here.
# `map` is an http-context directive and conf.d/*.conf is included inside
# http {}, so this belongs at the top of this file, outside the server block.
# ----------------------------------------------------------------------------
map $request_uri $quadis_is_acme {
    default                           0;
    "~^/\.well-known/acme-challenge/" 1;
}

server {
    listen 80 default_server;

    # Both names plus the catch-all. The names are what certbot --nginx keys
    # off when it issues and installs the certificate; `_` alone gives it
    # nothing to match and it will refuse. The catch-all stays so the box is
    # still reachable on the Elastic IP for testing before DNS moves.
    server_name www.quadishotels.com quadishotels.com _;

    root /var/www/quadis;
    index index.html;

    # ------------------------------------------------------------------
    # Apex -> www. www is her canonical host, not the apex.
    #
    # Her live site already 301s the apex to www on both HTTP and HTTPS, her
    # backlinks and sitemap point at www, and Razorpay's approved domain is
    # www. Serving both hostnames identically would split ranking signals
    # across two origins for the URLs that already rank — see AGENTS.md 3a.
    #
    # Guarded on the exact hostname so it does NOT fire for requests to the
    # Elastic IP; testing on 13.234.85.127 must keep working before cutover.
    #
    # THE ACME EXCEPTION IS LOAD-BEARING — DO NOT SIMPLIFY THIS BACK TO A
    # SINGLE `if ($host = ...)`. A server-level `if` runs in nginx's
    # SERVER_REWRITE phase, which is BEFORE location selection. So this
    # `return 301` pre-empts EVERY location in this block, including the
    # acme-challenge one below and including anything certbot inserts. With
    # the plain one-line version, Let's Encrypt fetching
    # http://quadishotels.com/.well-known/acme-challenge/<token> got a 301 to
    # https://www..., followed it, and hit a closed port 443 — because 443
    # does not exist until the certificate this request is trying to issue
    # has been issued. Verified against the box on 31 Jul, before DNS moved:
    # apex + challenge path -> 301. The apex would have failed validation and
    # burned Let's Encrypt's five-failures-per-hour limit on cutover day.
    #
    # $quadis_is_acme is mapped at the top of this file. nginx treats "0" and
    # "" as false, so only the literal "1" trips the second `set`.
    # ------------------------------------------------------------------
    set $quadis_redirect "";
    if ($host = quadishotels.com) { set $quadis_redirect "apex"; }
    if ($quadis_is_acme)          { set $quadis_redirect "${quadis_redirect}-acme"; }

    if ($quadis_redirect = "apex") {
        return 301 https://www.quadishotels.com$request_uri;
    }

    # ------------------------------------------------------------------
    # Let's Encrypt HTTP-01 challenge. MUST be declared before the dotfile
    # deny below, and MUST keep the `^~`.
    #
    # `/.well-known/acme-challenge/…` contains `/.`, so the `location ~ /\.`
    # deny rule below matches it and returns 404. Verified on the box 31 Jul:
    # www + challenge path -> 404, which is a failed validation, not a
    # harmless miss. `^~` on a prefix location tells nginx to skip regex
    # locations entirely once this is the longest prefix match, so this wins
    # over that deny — a plain prefix location would NOT.
    #
    # Serving this ourselves from a fixed webroot is deliberate: it means
    # validation does not depend on certbot's nginx plugin successfully
    # rewriting this file at runtime. deploy/cutover.sh pairs with it by
    # authenticating with `-a webroot -w /var/www/certbot`.
    #
    # Nothing else is ever served from this root, and it is empty except
    # during the seconds a challenge is in flight.
    # ------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Never serve dotfiles.
    #
    # `try_files $uri` below will happily return any file that exists under
    # the web root. If anyone ever syncs the repo root here instead of the
    # built artifact, that is /backend/.env — a live Groq key — over HTTP on
    # the client's own domain. deploy/install.sh only ever copies dist/, but
    # this is the backstop for the day someone deploys by hand.
    #
    # Declared FIRST so it wins regardless of what follows.
    # ------------------------------------------------------------------
    # Applies to this block and to every location that does not declare its
    # own add_header. Those that do re-include it explicitly — see the file.
    include /etc/nginx/snippets/security-headers.conf;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Same reasoning for the working directories. These are not part of the
    # build artifact and must never be reachable even if one lands here:
    # docs/client-comms/** is internal client correspondence and .agents/
    # holds account IDs and incident history.
    location ~ ^/(docs|\.agents|client-assets|backend|src|scripts|deploy|node_modules)/ {
        deny all;
        return 404;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ------------------------------------------------------------------
    # API. The unit behind this is deploy/quadis-api.service; if it is not
    # running these 502 rather than falling through to index.html, which is
    # what makes the failure visible instead of silent.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Invoices and image uploads both exceed the 1m default.
        client_max_body_size 25m;
    }

    # ------------------------------------------------------------------
    # Legacy 301s from the client's existing site — 63 URLs.
    #
    # MUST be included before the SPA fallback: `try_files $uri /index.html`
    # answers 200 for anything, so a redirect declared after it never fires.
    #
    # Mirrors src/data/legacyRoutes.ts, which is the source of truth. A rule
    # in one and not the other is invisible in testing because the React
    # fallback silently covers for the missing nginx rule.
    # ------------------------------------------------------------------
    include /etc/nginx/snippets/legacy-redirects.conf;

    # ------------------------------------------------------------------
    # Static assets. Vite content-hashes everything under /assets/, so those
    # are safe to pin immutable for a year. Images and video are not hashed,
    # so they get a shorter life — long enough to matter, short enough that
    # replacing a hotel photo shows up the same week.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;

        access_log off;
    }

    location ~* \.(webp|avif|jpg|jpeg|png|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location /videos/ {
        expires 30d;
        add_header Cache-Control "public";
    include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html must NOT be cached, or a deploy ships a new bundle that
    # nobody's browser asks for.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # SPA fallback. Declared last on purpose.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
