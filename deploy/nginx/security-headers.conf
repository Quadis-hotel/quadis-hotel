# Security response headers for the static site.
#
# The API sets its own via helmet (CSP, HSTS, X-Frame-Options and the rest are
# visible on any /api/ response). nginx serves every HTML page and asset
# directly, so none of that applied to the documents themselves — the site was
# framable by anyone, which is a clickjacking overlay away from a guest typing
# card details into someone else's page.
#
# `always` matters: without it these are attached to 2xx/3xx only, so error
# pages and redirects would go out bare.
#
# This is included rather than set once at server level because nginx's
# add_header does NOT inherit into a location that declares its own. Several
# locations here set Cache-Control, which would silently drop every header
# below for exactly the assets most worth protecting. Any new location that
# adds a header must include this file too.

# Clickjacking. Both spellings: X-Frame-Options for older agents, and the CSP
# directive that supersedes it for current ones. This stays ENFORCED — it is
# the one directive that cannot break a legitimate page, because nothing here
# is meant to be framed by anyone.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;

# The full policy, REPORT-ONLY. It is evaluated and violations are posted to
# /api/csp-report, but nothing is blocked. That is deliberate: get script-src
# wrong and the Razorpay checkout script silently fails to load, so the pay
# button does nothing — no error the guest sees, none in our logs, just
# payments quietly not happening. Run this, complete a real booking end to end,
# read the reports, widen for anything legitimate, and only then move these
# directives into the enforced header above.
#
# Sources, each traced to something in the codebase rather than guessed:
#   checkout.razorpay.com   CheckoutModal.tsx loads /v1/checkout.js
#   *.razorpay.com          checkout.js pulls further scripts, frames and
#                           beacons from sibling hosts during payment
#   fonts.googleapis.com    index.html stylesheet link
#   fonts.gstatic.com       the font files that stylesheet references
#   maps.google.com         Location.tsx and blocks.tsx embed map iframes
#   'unsafe-inline' (style) the components style almost everything through
#                           React style={{...}} attributes; removing it is a
#                           refactor, not a header change
#   img-src https:          admin-uploaded photos are served from whatever
#                           IMAGE_PUBLIC_URL points at. Images cannot execute,
#                           so a broad allowance here is cheap.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.razorpay.com; frame-src 'self' https://maps.google.com https://www.google.com https://*.razorpay.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://*.razorpay.com; object-src 'none'; report-uri /api/csp-report" always;

# Stop content-type sniffing turning an uploaded image into script.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak the full URL (booking codes appear in paths) to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS deliberately WITHOUT includeSubDomains. This server block answers for
# the apex as well as www, so includeSubDomains would pin every sibling under
# quadishotels.com to HTTPS — including adminweb.quadishotels.com, which this
# deploy does not control and cannot verify. A year of enforced HTTPS on the
# hosts we do serve is the win; the subdomain sweep is not worth breaking a
# host we cannot test from here.
add_header Strict-Transport-Security "max-age=31536000" always;

# Nothing on the site uses these.
add_header Permissions-Policy "camera=(), microphone=()" always;
