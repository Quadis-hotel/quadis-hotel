# Legacy URL redirects for the quadishotels.com cutover.
#
# We move onto the client's existing domain, so on switch day her Google
# results, her sitemap and every backlink keep pointing at these exact paths —
# they just start hitting our server. Her sitemap lists 74 URLs; checked
# against src/App.tsx on 30 Jul 2026, only 11 resolved. These are the other 63.
#
# THIS FILE IS AUTHORITATIVE FOR SEO. A search engine needs a real 301 to move
# a ranking; the React fallback in src/components/LegacyRedirect.tsx cannot
# issue one — it renders a 200 and then changes the URL client-side. Both exist
# because the React half also works on the current S3/CloudFront deploy, and it
# means a missing rule here degrades to a working page instead of a 404.
#
# Keep this in step with src/data/legacyRoutes.ts. They must agree: a rule in
# one and not the other is invisible in testing, because the React fallback
# silently covers for whatever nginx misses.
#
# Include from the server block:
#     include /etc/nginx/snippets/legacy-redirects.conf;
#
# Order matters. These must come BEFORE the SPA fallback (`try_files $uri
# /index.html`), or index.html answers first and no redirect ever fires.

# ---------------------------------------------------------------------------
# 1. Standalone pages whose path changed, or that did not exist here.
# ---------------------------------------------------------------------------

location = /contactus                { return 301 /contact; }

# No careers page here. A careers enquiry belongs on the contact form.
location = /career-at-quadis         { return 301 /contact; }

# /privacy-policy and /terms-and-conditions are NOT redirects — both are real
# pages now, ported from her existing site. They fall through to the SPA.

# ---------------------------------------------------------------------------
# 2. Banquets. Hers read `banquet-hall-at-…`, ours `banquets-at-…`.
# ---------------------------------------------------------------------------

location = /banquets/banquet-hall-at-hotel-amby-inn {
    return 301 /banquets/banquets-at-hotel-amby-inn;
}
location = /banquets/banquet-hall-at-hotel-downtown-eok {
    return 301 /banquets/banquets-at-hotel-downtown-eok;
}
location = /banquets/banquet-hall-at-hotel-downtown-sector-51-noida {
    return 301 /banquets/banquets-at-hotel-downtown-sector-51;
}

# She has a Cladis Sector 15 banquet venue that we do not. Send it to the list
# rather than to a detail page that would render empty.
location = /banquets/banquet-hall-at-hotel-cladis-sector-15-noida {
    return 301 /banquets;
}

# Not a venue at all — a marketing page under the same prefix.
location = /banquets/we-offers       { return 301 /banquets; }

# ---------------------------------------------------------------------------
# 3. Hotel pages. Seven of her eight slugs now match ours exactly and need no
#    rule. This one does not.
#
#    DELETE the matching rule if the slug is ever renamed on our side —
#    otherwise it redirects to itself and the browser reports a loop. That is
#    exactly what happened to `hotel-amar-inn`: we fixed our typo on 31 Jul so
#    our slug became hers, and its rule was removed from here and from
#    src/data/legacyRoutes.ts together.
# ---------------------------------------------------------------------------

location = /hotels/hotel-amby-inn {
    return 301 /hotels/hotel-amby-inn-lajpat-nagar-ii;
}

# ---------------------------------------------------------------------------
# 4. Room pages — 52 of the 63, and the bulk of her SEO surface.
#
#    Hers are `/<hotel-slug>/<room-slug>` at the TOP LEVEL, not under /hotels/,
#    with one page per room per meal plan (…-deluxe-room, …-with-breakfast,
#    …-with-breakfast-lunch-dinner).
#
#    They collapse to the hotel page, which is where those rooms now live. We
#    deliberately do not deep-link a room: her room slugs do not map onto our
#    room ids and a wrong guess shows a guest the wrong room class.
#
#    Written out per hotel rather than as a `map`. A map would be tidier, but
#    it is only legal in the `http` context, not in `server` — and driving one
#    off a regex capture makes the value depend on when nginx happens to
#    evaluate it. Eight explicit rules cannot be wrong in either of those ways,
#    and each one anchors on a whole slug so nothing else can match.
# ---------------------------------------------------------------------------

location ~ "^/hotel-amar-inn/[^/]+/?$" {
    return 301 /hotels/hotel-amar-inn;
}
location ~ "^/hotel-amby-inn/[^/]+/?$" {
    return 301 /hotels/hotel-amby-inn-lajpat-nagar-ii;
}
location ~ "^/hotel-cladis-sector-15-noida/[^/]+/?$" {
    return 301 /hotels/hotel-cladis-sector-15-noida;
}
location ~ "^/hotel-cladis-sector-19-noida/[^/]+/?$" {
    return 301 /hotels/hotel-cladis-sector-19-noida;
}
location ~ "^/hotel-downtown-east-of-kailash/[^/]+/?$" {
    return 301 /hotels/hotel-downtown-east-of-kailash;
}
location ~ "^/hotel-downtown-sector-15-noida/[^/]+/?$" {
    return 301 /hotels/hotel-downtown-sector-15-noida;
}
location ~ "^/hotel-downtown-sector-51-noida/[^/]+/?$" {
    return 301 /hotels/hotel-downtown-sector-51-noida;
}
location ~ "^/hotel-quadis-sector-51-noida/[^/]+/?$" {
    return 301 /hotels/hotel-quadis-sector-51-noida;
}
